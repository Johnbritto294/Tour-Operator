<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Stackly Tours</title><meta name="description" content="The page you are looking for could not be found.">
<link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://images.pexels.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet"></head>
<body>

<main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="container text-center">
<div class="mb-4">
  <a href="index.html" class="auth-brand" aria-label="Stackly Home"><img src="logo_matching_light.webp" alt="Stackly"></a>
</div>
<span class="tag">Error 404</span>
<h1 class="mt-4 mb-0" style="font-size:clamp(6rem,20vw,13rem);line-height:.85;color:var(--lagoon)">404</h1>
<h2 class="mt-3">This page has wandered off the map.</h2>
<p class="muted mt-3 mx-auto" style="max-width:52ch">The link may be old, the trail may have moved, or the page was never here. Let's get you back to solid ground.</p>
<div class="d-flex gap-3 justify-content-center flex-wrap mt-4">
<a href="index.html" class="btn btn-sun btn-lg"><i class="bi bi-house-door me-2"></i>Go to home</a>
<button type="button" id="backBtn" class="btn btn-lagoon btn-lg"><i class="bi bi-arrow-left me-2"></i>Back to previous</button>
</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.getElementById('backBtn').addEventListener('click',function(){
  sessionStorage.setItem('stackly_returning','1');
  var prev=sessionStorage.getItem('stackly_prev_url')||document.referrer;
  if(history.length>1){history.back()}else if(prev){window.location.href=prev}else{window.location.href='index.html'}
});
</script>
</body></html>
