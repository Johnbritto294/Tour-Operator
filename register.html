<div class="auth"><div class="auth-img"><img src="assets/img/1506929562872-bb421503ef21.webp" class="eager" data-img="1506929562872-bb421503ef21" data-w="1200" alt=""><div><p class="quote">"Planning a trip should feel as good as taking it."</p></div></div>
<div class="auth-form"><form data-form="register" novalidate><div class="auth-top"><a href="index.html" class="auth-brand"><img src="logo_matching_light.webp" alt="Stackly"></a><a href="index.html" class="auth-home-link"><i class="bi bi-arrow-left"></i> Back to home</a></div><h1 style="font-size:2.6rem">Create your account</h1><p class="muted mb-3">Save trips, track bookings and manage travellers.</p><div class="mb-3"><label class="form-label">Select role</label><div class="role-switch"><input type="radio" name="role" id="reg-role-user" value="user" checked><label for="reg-role-user"><i class="bi bi-person"></i> User</label><input type="radio" name="role" id="reg-role-admin" value="admin"><label for="reg-role-admin"><i class="bi bi-shield-lock"></i> Admin</label></div></div><div class="mb-3"><label class="form-label" for="name">Full name</label><input id="name" name="name" type="text" class="form-control" required pattern="^[A-Za-z\s.'-]+$" title="Only alphabetic characters are allowed (no numbers)" autocomplete="name" placeholder="e.g. Daniel Mathew"></div><div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$" title="Email must end with .com (e.g. name@example.com)" placeholder="you@example.com"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" name="password" type="password" class="form-control" required minlength="6" placeholder="At least 6 characters" title="Password must be at least 6 characters"></div><div class="mb-3"><label class="form-label" for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" class="form-control" required minlength="6" placeholder="Re-enter password" title="Confirm password must be at least 6 characters"></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" name="terms" required><label class="form-check-label" for="terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></label></div><button class="btn btn-lagoon btn-lg w-100 mt-2">Create account</button><div class="auth-divider"><span>or continue with</span></div><div class="auth-social-grid"><a href="404.html" class="auth-social-btn" aria-label="Sign up with Google" title="Google"><i class="bi bi-google"></i></a><a href="404.html" class="auth-social-btn" aria-label="Sign up with Apple" title="Apple"><i class="bi bi-apple"></i></a><a href="404.html" class="auth-social-btn" aria-label="Sign up with Facebook" title="Facebook"><i class="bi bi-facebook"></i></a><a href="404.html" class="auth-social-btn" aria-label="Sign up with X" title="X"><i class="bi bi-twitter-x"></i></a></div><p class="mt-4 text-center muted">Already registered? <a href="login.html">Log in</a></p></form></div></div>
